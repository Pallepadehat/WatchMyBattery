name: CI

# Branch protection on develop and main requires these jobs by name (Lint, BatteryKit tests, Build app), so keep the
# names stable. Renaming one means updating the protection rules too.

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: swift format lint --strict -r WatchMyBattery WatchMyBatteryHelper Shared Packages/BatteryKit scripts
      # Xcode sometimes marks source folders "opaque" when the project is opened, which turns the Swift files into
      # resources and leaves the app with nothing to compile. The app build below can't run on the runners yet, so
      # catch it here.
      - name: Check the project compiles its sources
        run: |
          if grep -q '"opaque-folders"' WatchMyBattery.xcodeproj/project.xcproj; then
            echo "::error file=WatchMyBattery.xcodeproj/project.xcproj::Source folders are marked opaque-folders, so they won't compile. Remove the \"opaque-folders\" key."
            exit 1
          fi

  test:
    name: BatteryKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Unit tests, and the integration tests against the runner's kernel and disk. The runners are virtual Macs
      # without a battery, so the tests that need one skip themselves.
      - name: Run tests
        working-directory: Packages/BatteryKit
        run: swift test

  # Not required for merging: runners differ too much from one another for their timings to block anything. It
  # still fails a benchmark that goes far over its budget, and the numbers are kept for comparing runs.
  benchmarks:
    name: Benchmarks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run benchmarks
        working-directory: Packages/BatteryKit
        run: swift run -c release BatteryKitBenchmarks --quick --report-only --json benchmarks.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: Packages/BatteryKit/benchmarks.json

  build:
    name: Build app
    # macos-latest lags behind on Xcode; the macOS 26 image is where new Xcode versions arrive first.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The project uses Xcode 27's project format, which older Xcode versions
      # can't open. Skip (with a notice) on a runner that doesn't have Xcode 27 yet.
      - name: Check the Xcode version
        id: xcode
        run: |
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -ge 27 ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=App build skipped::The project needs Xcode 27 or later; this runner has Xcode $major."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.xcode.outputs.supported == 'true'
        run: |
          xcodebuild build \
            -project WatchMyBattery.xcodeproj \
            -scheme WatchMyBattery \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            | tee build.log
          # Warnings in our own code fail the build, as CONTRIBUTING asks.
          if grep -E "warning: .*(WatchMyBattery|BatteryKit)/" build.log | grep -v "Sparkle"; then
            echo "::error::The app builds with warnings."
            exit 1
          fi
      # The real app, launched the way people run it: it has to start, record, and quit cleanly. Its costs are only
      # reported here (a virtual Mac says little about energy); scripts/check.sh holds them to account before a release.
      - name: End to end
        if: steps.xcode.outputs.supported == 'true'
        continue-on-error: true
        run: swift scripts/e2e.swift --app build/DerivedData/Build/Products/Release/WatchMyBattery.app --quick --report-only

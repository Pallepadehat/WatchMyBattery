# Copy to wrangler.toml (git-ignored) and fill in the database ID: see README.md.
name = "watchmybattery-stats"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No request logs: the Worker keeps only what a ping says.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "watchmybattery-stats"
# From `npx wrangler d1 create watchmybattery-stats` (see README.md).
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Each IP (hashed in the Worker) gets 10 requests a minute: plenty for a ping a day, little for a script.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
